# Cargo workspace for the beagle-turso monorepo.
# The Ruby gems (beagle-turso, activerecord-beagle-turso) live under gems/, and their
# native extensions (Magnus/rb-sys, e.g. gems/beagle-turso/ext/beagle_turso) are cargo
# workspace members so `cargo build`/`rake compile` share the workspace's target dir
# and lockfile. Validated spikes under spikes/ are excluded from the build.
[workspace]
resolver = "2"
members = ["crates/beagle_turso_core", "gems/beagle-turso/ext/beagle_turso"]
exclude = ["spikes"]
