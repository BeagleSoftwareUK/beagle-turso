[package]
name = "beagle_turso_core"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "A synchronous Rust façade over the Turso database engine."
readme = "README.md"
repository = "https://github.com/BeagleSoftwareUK/beagle-turso"

[dependencies]
turso = { version = "=0.7.2", features = ["sync"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
thiserror = "2"

[dev-dependencies]
anyhow = "1"
