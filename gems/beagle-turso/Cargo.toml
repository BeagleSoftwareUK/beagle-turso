# Standalone Cargo workspace for this gem's native extension.
#
# The monorepo root's Cargo.toml excludes gems/beagle-turso/ext/beagle_turso
# so a plain `cargo build`/`clippy`/`test --workspace` at the repo root stays
# Ruby-free. `bundle exec rake compile` runs rb_sys, which shells out to
# `cargo metadata --no-deps` with NO `--manifest-path`, relying solely on the
# current directory (this one, where the Rakefile lives) and Cargo's
# built-in upward search for the nearest ancestor `Cargo.toml` with a
# `[workspace]` table. Without this file, that search would keep walking up
# past this (member-less) directory to the repo root workspace — which no
# longer lists the ext — and rb_sys would raise `PackageNotFoundError`.
# Declaring this small workspace here gives Cargo something to find right
# away, independent of the root workspace.
#
# Because this file (not the repo root's) is the workspace Cargo actually
# resolves the ext against, it needs its OWN [patch.crates-io]: the ext's
# `beagle_turso_core` dependency now names a published version ("0.1.0", see
# ext/beagle_turso/Cargo.toml) so packaged/published gems resolve it from
# crates.io, but in-repo builds (rake compile, rspec, gem build) must still
# use the local crate. The repo root's [patch.crates-io] does NOT reach here
# -- Cargo's upward workspace search stops at the first `[workspace]` table
# it finds (this one), so it never continues on to inspect the root's patch.
[workspace]
resolver = "2"
members = ["ext/beagle_turso"]

[patch.crates-io]
beagle_turso_core = { path = "../../crates/beagle_turso_core" }
